# Perfil "dev": roda o back-end SEM Supabase e SEM variáveis de ambiente, usando um banco H2 em memória.
# Os dados são recriados a cada inicialização (o DataSeeder cria as contas e carros de demonstração).
# Ativar:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# NÃO usar em produção.
spring.datasource.url=jdbc:h2:mem:vitour;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secret=chave-somente-para-desenvolvimento-nao-usar-em-producao